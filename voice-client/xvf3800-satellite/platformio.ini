; Home Music Agent — XVF3800 独立语音入口（XIAO ESP32S3 卫星固件）
; 板卡与引脚定义对齐官方 ESPHome 配置：
;   https://github.com/respeaker/reSpeaker_XVF3800_ESPHome_Assistant (master)
;
; 构建前先 vendor tflite 运行时（一次性）：
;   PowerShell:  tools/vendor-esp-tflite.ps1
;   Bash:        bash tools/vendor-esp-tflite.sh
[env:xiao_esp32s3]
platform = espressif32 @ 6.10.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; XIAO ESP32S3：8MB Flash (QIO) + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -Isrc/msf/include
    -Isrc/msf/src
    -Isrc/mww
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
lib_ignore =
    tflm_esp32
